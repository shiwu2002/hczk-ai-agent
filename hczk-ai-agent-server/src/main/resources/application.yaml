server:
  port: 8080
  servlet:
    context-path: /api
    
spring:
  application:
    name: 桓宸智科AI平台
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms
      timeout: 2000ms



  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:2752541202@qq.com}
    password: ${QQ_EMIL:}
    from: ${MAIL_USERNAME:2752541202@qq.com}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

jwt:
  expiration: 86400000
  refresh-expiration: 604800000
  agent:
    shared-secret: ${JWT_AGENT_SHARED_SECRET:hczk-agent-jwt-secret-2026-very-long-and-secure}
    expiration: 3600000
    issuer: hczk-platform

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 平台基础配置
app:
  platform-url: ${APP_PLATFORM_URL:http://localhost:8080}

# 知识库服务配置
knowledge:
  milvus:
    address: 192.168.1.3:19530
    username:
    password:
    connect-timeout-ms: 10000
    keep-alive-time-ms: 30000
  embedding:
    base-url: http://localhost:8000/v1
    api-key: admin
    model: Qwen3-VL-Embedding-2B-4bit
    dimension: 2048
    timeout-ms: 30000
    batch-size: 20
    cache-max-size: 10000
  ingest:
    max-text-size: 5242880
    chunk-size: 800
    chunk-overlap-sentences: 2
    milvus-batch-size: 100
  # 入库前 LLM 预处理：通过模型对文档进行总结与语义切割，提升检索质量
  llm-preprocess:
    enabled: false              # 是否启用（默认关闭，启用后非QA文档会先经LLM总结切割）
    model-id: 1                 # 用于预处理的 AiModel ID（ai_models 表主键）
    min-text-length: 200        # 触发预处理的最小文本长度（字符）
    max-input-chars: 50000      # 单次送入LLM的最大文本长度（超出分段处理）
    target-chunk-size: 500      # LLM产出的每个语义块目标长度（字符）
    timeout-ms: 120000          # LLM调用超时（毫秒）
    chunk-delimiter: "\n\n===CHUNK===\n\n"  # LLM输出中块分隔符
  # v11 OCR 服务：处理 PDF 扫描件、图片等无法通过文本提取获得有效内容的文档
  ocr:
    enabled: false              # 是否启用 OCR（默认关闭）
    base-url: https://open.bigmodel.cn/api/paas/v4  # GLM-OCR API 地址
    api-key:                    # API Key
    model: glm-ocr              # OCR 模型名称
    timeout-ms: 60000           # 调用超时（毫秒）
    max-retries: 2              # 最大重试次数
    scanned-detect-chars-per-page: 50  # 扫描件检测阈值（字符/页，低于此值判定为扫描件）
    render-dpi: 200             # PDF 渲染为图片的 DPI
  retrieve:
    default-top-k: 5
    max-top-k: 50
    hybrid-confidence: 0.7
    vector-confidence: 0.5
    keyword-confidence: 0.3
    fallback-confidence: 0.2
    question-weight: 1.2
    nprobe: 16
  relevance:
    half-life-ms: 2592000000
    min-score: 0.01
    max-score: 10.0
    default-score: 1.0
    adopt-ratio-weight: 2.0
    adopt-bonus-weight: 0.1
    update-threshold: 0.01

logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ZFBAPPID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:http://s33ad2fe.natappfree.cc/api/billing/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/recharge}
  sign-type: RSA2
  charset: UTF-8
  format: json
