server:
  port: 8080
  servlet:
    context-path: /api
    
spring:
  application:
    name: 桓宸智科AI平台
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 30000
    listener:
      simple:
        concurrency: 5
        max-concurrency: 20
        prefetch: 10
        acknowledge-mode: auto

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:2752541202@qq.com}
    password: ${QQ_EMIL:}
    from: ${MAIL_USERNAME:2752541202@qq.com}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

jwt:
  expiration: 86400000
  refresh-expiration: 604800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

platform:
  billing:
    input-multiplier: 1.0
    output-multiplier: 1.0
    min-recharge: 10.00

# 知识库服务配置
knowledge:
  milvus:
    address: 192.168.1.3:19530
    username:
    password:
    connect-timeout-ms: 10000
    keep-alive-time-ms: 30000
  embedding:
    base-url: http://192.168.1.3:1234/v1
    api-key:
    model: text-embedding-qwen3-embedding
    dimension: 2560
    timeout-ms: 30000
    batch-size: 20
    cache-max-size: 10000
  ingest:
    max-text-size: 5242880
    chunk-size: 800
    chunk-overlap-sentences: 2
    milvus-batch-size: 100
  retrieve:
    default-top-k: 5
    max-top-k: 50
    hybrid-confidence: 0.7
    vector-confidence: 0.5
    keyword-confidence: 0.3
    fallback-confidence: 0.2
    question-weight: 1.2
    nprobe: 16
  relevance:
    half-life-ms: 2592000000
    min-score: 0.01
    max-score: 10.0
    default-score: 1.0
    adopt-ratio-weight: 2.0
    adopt-bonus-weight: 0.1
    update-threshold: 0.01

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
