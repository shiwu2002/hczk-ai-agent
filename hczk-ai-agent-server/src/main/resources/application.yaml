server:
  port: 8080
  servlet:
    context-path: /api
    
spring:
  application:
    name: 桓宸智科AI平台
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:848572306@qq.com}
    password: ${QQ_SMTP_KEY:}
    from: ${MAIL_USERNAME:848572306@qq.com}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

jwt:
  expiration: 86400000
  refresh-expiration: 604800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

platform:
  billing:
    input-multiplier: 1.0
    output-multiplier: 1.0
    min-recharge: 10.00

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
